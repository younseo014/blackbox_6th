    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {

  height: auto;

#widget &gt; svg {

.text-destructive {

}

    convenience_store:{label:&#x27;편의점&#x27;,icon:&#x27;🏪&#x27;,zones:[[&#x27;ENTRANCE&#x27;,&#x27;출입구&#x27;],[&#x27;POS&#x27;,&#x27;POS·카운터&#x27;],[&#x27;CASH_SAFE&#x27;,&#x27;시재·금고&#x27;],[&#x27;RECEIVING&#x27;,&#x27;물류 입고&#x27;],[&#x27;DISPLAY_FOOD&#x27;,&#x27;식품 매대&#x27;],[&#x27;DISPLAY_GENERAL&#x27;,&#x27;일반 매대&#x27;],[&#x27;WALK_IN_COOLER&#x27;,&#x27;워크인 냉장고&#x27;],[&#x27;STORAGE&#x27;,&#x27;창고&#x27;],[&#x27;AISLE&#x27;,&#x27;매장 통로&#x27;],[&#x27;WASTE&#x27;,&#x27;분리수거&#x27;],[&#x27;REST&#x27;,&#x27;휴식&#x27;]],tasks:[[&#x27;시재 점검&#x27;,&#x27;open&#x27;,[&#x27;POS&#x27;,&#x27;CASH_SAFE&#x27;],[&#x27;STAND&#x27;,&#x27;REPETITIVE_ARM&#x27;]],[&#x27;물류 입고·검수&#x27;,&#x27;open&#x27;,[&#x27;RECEIVING&#x27;,&#x27;STORAGE&#x27;],[&#x27;BEND_DOWN&#x27;,&#x27;CARRY&#x27;]],[&#x27;유통기한 확인&#x27;,&#x27;business&#x27;,[&#x27;DISPLAY_FOOD&#x27;,&#x27;AISLE&#x27;],[&#x27;WALK&#x27;,&#x27;REACH_FORWARD&#x27;]],[&#x27;상품 페이스업&#x27;,&#x27;business&#x27;,[&#x27;DISPLAY_FOOD&#x27;,&#x27;DISPLAY_GENERAL&#x27;],[&#x27;REPETITIVE_ARM&#x27;,&#x27;REACH_FORWARD&#x27;]],[&#x27;POS 결제&#x27;,&#x27;business&#x27;,[&#x27;POS&#x27;],[&#x27;STAND&#x27;,&#x27;REPETITIVE_ARM&#x27;]],[&#x27;상품 진열&#x27;,&#x27;business&#x27;,[&#x27;STORAGE&#x27;,&#x27;DISPLAY_GENERAL&#x27;],[&#x27;CARRY&#x27;,&#x27;REACH_UP&#x27;]],[&#x27;냉장고 채우기&#x27;,&#x27;business&#x27;,[&#x27;WALK_IN_COOLER&#x27;,&#x27;STORAGE&#x27;],[&#x27;CARRY&#x27;,&#x27;PUSH_PULL&#x27;]],[&#x27;쓰레기·분리수거&#x27;,&#x27;close&#x27;,[&#x27;WASTE&#x27;,&#x27;ENTRANCE&#x27;],[&#x27;CARRY&#x27;,&#x27;BEND_DOWN&#x27;]],[&#x27;시재 마감·인수인계&#x27;,&#x27;close&#x27;,[&#x27;POS&#x27;,&#x27;CASH_SAFE&#x27;],[&#x27;STAND&#x27;,&#x27;REPETITIVE_ARM&#x27;]],[&#x27;휴식&#x27;,&#x27;break&#x27;,[&#x27;REST&#x27;],[&#x27;SIT&#x27;,&#x27;STATIC_PAUSE&#x27;]]],sequences:[[&#x27;상품 보충 루프&#x27;,[&#x27;STORAGE&#x27;,&#x27;AISLE&#x27;,&#x27;DISPLAY_GENERAL&#x27;]],[&#x27;편의점 마감&#x27;,[&#x27;POS&#x27;,&#x27;WASTE&#x27;,&#x27;AISLE&#x27;]]]},
    clothing_store:{label:&#x27;1인 옷가게&#x27;,icon:&#x27;👗&#x27;,zones:[[&#x27;ENTRANCE&#x27;,&#x27;출입구&#x27;],[&#x27;POS_ADMIN&#x27;,&#x27;계산·장부&#x27;],[&#x27;DISPLAY&#x27;,&#x27;의류 진열&#x27;],[&#x27;FOLDING_TABLE&#x27;,&#x27;폴딩 테이블&#x27;],[&#x27;FITTING_ROOM&#x27;,&#x27;피팅룸&#x27;],[&#x27;STEAMING&#x27;,&#x27;스팀 다림질&#x27;],[&#x27;WINDOW_MANNEQUIN&#x27;,&#x27;쇼윈도·마네킹&#x27;],[&#x27;STOCK&#x27;,&#x27;재고 보관&#x27;],[&#x27;MIRROR_CONTENT&#x27;,&#x27;거울·콘텐츠&#x27;],[&#x27;SECURITY_SHUTTER&#x27;,&#x27;보안 셔터&#x27;],[&#x27;REST&#x27;,&#x27;휴식&#x27;]],tasks:[[&#x27;스팀 다림질&#x27;,&#x27;open&#x27;,[&#x27;STEAMING&#x27;],[&#x27;ARM_ELEVATED&#x27;,&#x27;REPETITIVE_ARM&#x27;]],[&#x27;마네킹·행거 세팅&#x27;,&#x27;open&#x27;,[&#x27;WINDOW_MANNEQUIN&#x27;,&#x27;ENTRANCE&#x27;],[&#x27;CARRY&#x27;,&#x27;PUSH_PULL&#x27;]],[&#x27;의류 폴딩&#x27;,&#x27;business&#x27;,[&#x27;FOLDING_TABLE&#x27;],[&#x27;REPETITIVE_ARM&#x27;,&#x27;REACH_FORWARD&#x27;]],[&#x27;선반·행거 진열&#x27;,&#x27;business&#x27;,[&#x27;DISPLAY&#x27;,&#x27;STOCK&#x27;],[&#x27;CARRY&#x27;,&#x27;REACH_UP&#x27;]],[&#x27;피팅 도움&#x27;,&#x27;business&#x27;,[&#x27;FITTING_ROOM&#x27;,&#x27;DISPLAY&#x27;,&#x27;STOCK&#x27;],[&#x27;WALK&#x27;,&#x27;ARM_ELEVATED&#x27;]],[&#x27;SNS 거울 촬영&#x27;,&#x27;business&#x27;,[&#x27;MIRROR_CONTENT&#x27;],[&#x27;ARM_ELEVATED&#x27;,&#x27;TURN_BODY&#x27;]],[&#x27;피팅룸 의류 원위치&#x27;,&#x27;close&#x27;,[&#x27;FITTING_ROOM&#x27;,&#x27;FOLDING_TABLE&#x27;,&#x27;DISPLAY&#x27;],[&#x27;CARRY&#x27;,&#x27;REACH_UP&#x27;]],[&#x27;보안 셔터 내리기&#x27;,&#x27;close&#x27;,[&#x27;SECURITY_SHUTTER&#x27;],[&#x27;REACH_UP&#x27;,&#x27;BEND_DOWN&#x27;,&#x27;PUSH_PULL&#x27;]],[&#x27;정산·장부 작성&#x27;,&#x27;close&#x27;,[&#x27;POS_ADMIN&#x27;],[&#x27;SIT&#x27;,&#x27;STATIC_PAUSE&#x27;]],[&#x27;휴식&#x27;,&#x27;break&#x27;,[&#x27;REST&#x27;],[&#x27;SIT&#x27;,&#x27;STATIC_PAUSE&#x27;]]],sequences:[[&#x27;피팅룸 정리&#x27;,[&#x27;FITTING_ROOM&#x27;,&#x27;FOLDING_TABLE&#x27;,&#x27;DISPLAY&#x27;]],[&#x27;옷가게 마감&#x27;,[&#x27;FITTING_ROOM&#x27;,&#x27;DISPLAY&#x27;,&#x27;POS_ADMIN&#x27;,&#x27;SECURITY_SHUTTER&#x27;]]]}
  };

  const phaseLabel = {open:&#x27;오픈&#x27;, business:&#x27;영업 중&#x27;, close:&#x27;마감&#x27;, break:&#x27;휴식&#x27;};
  const typeLabel = {occupation:&#x27;업종&#x27;,task:&#x27;업무&#x27;,zone:&#x27;구역&#x27;,motion:&#x27;스켈레톤 동작&#x27;,sequence:&#x27;루틴&#x27;};
  const svg = root.querySelector(&#x27;svg&#x27;);
  const selection = root.querySelector(&#x27;#ctx-selection&#x27;);
  const ns = &#x27;http://www.w3.org/2000/svg&#x27;;
  let currentKey = &#x27;cafe&#x27;;
  let activeType = null;
  let currentGraph = null;

  function svgElement(name, attributes = {}) {
    const element = document.createElementNS(ns, name);
    Object.entries(attributes).forEach(([key,value]) =&gt; element.setAttribute(key,String(value)));
    return element;
  }

  function buildGraph(key) {
    const item = data[key];
    const nodes = [{id:&#x27;occupation&#x27;,label:`${item.icon} ${item.label}`,type:&#x27;occupation&#x27;,detail:&#x27;선택한 업종의 중심 맥락&#x27;}];
    const links = [];
    const zoneLabels = Object.fromEntries(item.zones);
    item.zones.forEach(([id,label]) =&gt; nodes.push({id:`z:${id}`,label,type:&#x27;zone&#x27;,detail:`매장 구역 · ${id}`}));
    const motions = new Set();
    item.tasks.forEach((task,index) =&gt; {
      const [label,phase,zones,taskMotions] = task;
      const id = `t:${index}`;
      nodes.push({id,label,type:&#x27;task&#x27;,detail:`${phaseLabel[phase]} 업무 · 구역 ${zones.map(z=&gt;zoneLabels[z]||z).join(&#x27;, &#x27;)} · 동작 ${taskMotions.join(&#x27;, &#x27;)}`});
      links.push({source:&#x27;occupation&#x27;,target:id,relation:&#x27;업무&#x27;});
      zones.forEach(zone =&gt; links.push({source:id,target:`z:${zone}`,relation:&#x27;수행 구역&#x27;}));
      taskMotions.forEach(motion =&gt; { motions.add(motion); links.push({source:id,target:`m:${motion}`,relation:&#x27;관찰 동작&#x27;}); });
    });
    motions.forEach(motion =&gt; nodes.push({id:`m:${motion}`,label:motion,type:&#x27;motion&#x27;,detail:&#x27;스켈레톤 좌표에서 추출하는 기본 동작&#x27;}));
    item.sequences.forEach((sequence,index) =&gt; {
      const [label,zones] = sequence;
      const id = `s:${index}`;
      nodes.push({id,label,type:&#x27;sequence&#x27;,detail:`순서 구역 · ${zones.map(z=&gt;zoneLabels[z]||z).join(&#x27; → &#x27;)}`});
      links.push({source:&#x27;occupation&#x27;,target:id,relation:&#x27;루틴&#x27;});
      zones.forEach(zone =&gt; links.push({source:id,target:`z:${zone}`,relation:&#x27;이동 순서&#x27;}));
    });
    return {nodes,links};
  }

  function distribute(nodes, x, height) {
    const top = 30;
    const bottom = height - 30;
    const gap = nodes.length &gt; 1 ? (bottom - top) / (nodes.length - 1) : 0;
    nodes.forEach((node,index) =&gt; { node.x = x; node.y = nodes.length &gt; 1 ? top + gap * index : height / 2; });
  }

  function applyTypeHighlight() {
    if (!currentGraph) return;
    root.querySelectorAll(&#x27;[data-node-type]&#x27;).forEach(button =&gt; {
      button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.nodeType === activeType));
    });
    currentGraph.nodeElements.forEach(({node,element}) =&gt; {
      element.classList.toggle(&#x27;is-muted&#x27;, Boolean(activeType &amp;&amp; node.type !== activeType));
      element.classList.toggle(&#x27;is-category-highlight&#x27;, node.type === activeType);
      element.classList.remove(&#x27;is-selected&#x27;);
    });
    currentGraph.linkElements.forEach(element =&gt; element.classList.toggle(&#x27;is-muted&#x27;, Boolean(activeType)));
    if (activeType) {
      const count = currentGraph.nodes.filter(node =&gt; node.type === activeType).length;
      selection.textContent = `${typeLabel[activeType]} 노드 ${count}개만 강조하고 있어요. 같은 항목을 다시 누르면 전체가 보여요.`;
    } else {
      const item = data[currentKey];
      selection.textContent = `${item.label} · 구역 ${item.zones.length}개 · 업무 ${item.tasks.length}개 · 루틴 ${item.sequences.length}개`;
    }
  }

  function selectNode(selected) {
    const connected = new Set([selected.id]);
    currentGraph.links.forEach(link =&gt; {
      if (link.source === selected.id) connected.add(link.target);
      if (link.target === selected.id) connected.add(link.source);
    });
    activeType = null;
    root.querySelectorAll(&#x27;[data-node-type]&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;,&#x27;false&#x27;));
    currentGraph.nodeElements.forEach(({node,element}) =&gt; {
      element.classList.toggle(&#x27;is-selected&#x27;, node.id === selected.id);
      element.classList.toggle(&#x27;is-muted&#x27;, !connected.has(node.id));
      element.classList.remove(&#x27;is-category-highlight&#x27;);
    });
    currentGraph.linkElements.forEach((element,index) =&gt; {
      const link = currentGraph.links[index];
      element.classList.toggle(&#x27;is-muted&#x27;, link.source !== selected.id &amp;&amp; link.target !== selected.id);
    });
    const neighbors = connected.size - 1;
    selection.textContent = `${selected.label} · ${selected.detail} · 직접 연결 ${neighbors}개`;
  }

  function draw(key) {
    currentKey = key;
    svg.replaceChildren();
    const panel = root.querySelector(&#x27;#ctx-graph-panel&#x27;);
    const width = Math.max(320, panel.clientWidth || 736);
    const height = width &lt; 520 ? 720 : 620;
    svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);
    svg.append(svgElement(&#x27;title&#x27;,{id:&#x27;ctx-title&#x27;}),svgElement(&#x27;desc&#x27;,{id:&#x27;ctx-desc&#x27;}));
    svg.querySelector(&#x27;title&#x27;).textContent = &#x27;업종별 로컬 업무 맥락 관계 그래프&#x27;;
    svg.querySelector(&#x27;desc&#x27;).textContent = &#x27;선택한 업종에서 업무, 매장 구역, 스켈레톤 동작, 업무 루틴으로 이어지는 관계를 보여줍니다.&#x27;;
    const graph = buildGraph(key);
    const byType = type =&gt; graph.nodes.filter(node =&gt; node.type === type);
    distribute(byType(&#x27;occupation&#x27;),width * 0.07,height);
    distribute(byType(&#x27;sequence&#x27;),width * 0.18,height);
    distribute(byType(&#x27;task&#x27;),width * 0.38,height);
    distribute(byType(&#x27;zone&#x27;),width * 0.64,height);
    distribute(byType(&#x27;motion&#x27;),width * 0.9,height);
    const nodeById = Object.fromEntries(graph.nodes.map(node =&gt; [node.id,node]));
    const linksGroup = svgElement(&#x27;g&#x27;);
    const linkElements = graph.links.map(link =&gt; {
      const source = nodeById[link.source];
      const target = nodeById[link.target];
      const line = svgElement(&#x27;line&#x27;,{class:&#x27;link&#x27;,x1:source.x,y1:source.y,x2:target.x,y2:target.y});
      linksGroup.appendChild(line);
      return line;
    });
    svg.appendChild(linksGroup);
    const nodesGroup = svgElement(&#x27;g&#x27;);
    const nodeElements = graph.nodes.map(node =&gt; {
      const group = svgElement(&#x27;g&#x27;,{class:`node ${node.type}`,transform:`translate(${node.x},${node.y})`});
      const circle = svgElement(&#x27;circle&#x27;,{r:node.type === &#x27;occupation&#x27; ? 12 : node.type === &#x27;task&#x27; ? 7 : 5.5});
      const isRight = node.type === &#x27;motion&#x27;;
      const text = svgElement(&#x27;text&#x27;,{x:isRight ? -9 : node.type === &#x27;occupation&#x27; ? 16 : 9,y:4,&#x27;text-anchor&#x27;:isRight ? &#x27;end&#x27; : &#x27;start&#x27;});
      text.textContent = node.label;
      group.append(circle,text);
      group.addEventListener(&#x27;click&#x27;,()=&gt;selectNode(node));
      nodesGroup.appendChild(group);
      return {node,element:group};
    });
    svg.appendChild(nodesGroup);
    currentGraph = {...graph,nodeElements,linkElements};
    applyTypeHighlight();
  }

  root.querySelectorAll(&#x27;[data-key]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
    root.querySelectorAll(&#x27;[data-key]&#x27;).forEach(other =&gt; {
      const active = other === button;
      other.classList.toggle(&#x27;active&#x27;,active);
      other.setAttribute(&#x27;aria-selected&#x27;,String(active));
    });
    root.querySelector(&#x27;#ctx-graph-panel&#x27;).setAttribute(&#x27;aria-labelledby&#x27;,button.id);
    draw(button.dataset.key);
  }));
